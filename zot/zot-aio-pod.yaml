---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
data:
  # password can be generated by: openssl passwd -6 your-passwd
  auth.htpasswd: |-
    admin:$6$eTj2qnnocMG7i0b0$RYGcruajKNN7Ay7Co2Cf5KU75d.YNiBN8Wir1swe4Gy853oqps.ONREQb99RYGHEAkbja2jUwfjB7y1vtKm.j.
  config.yaml: |-
    http:
      address: "0.0.0.0"
      port: "443"
      compat: ["docker2s2"]
      tls:
        key: "/etc/zot/pki/tls.key"
        cert: "/etc/zot/pki/tls.crt"
      auth:
        htpasswd:
          path: "/etc/zot/conf/auth.htpasswd"
      accessControl:
        repositories:
          "**":
            anonymousPolicy: ["read"]
        adminPolicy:
          users: ["admin"]
          actions: ["read", "create", "update", "delete"]
    storage:
      rootDirectory: "/var/lib/zot"
    extensions:
      sync:
        enable: true
        registries:
          - onDemand: true  # podman pull xxx.com/docker/library/alpine:latest
            urls:
              - "https://docker.io"
            content:
              - prefix: "**"
                destination: "/docker"
          - onDemand: true  # podman pull xxx.com/quay/library/alpine:latest
            urls:
              - "https://quay.io"
            content:
              - prefix: "**"
                destination: "/quay"

---
apiVersion: v1
kind: Pod
metadata:
  name: zot
spec:
  containers:
    - name: zot
      image: ghcr.io/project-zot/zot-linux-amd64:latest
      command:
        - zot-linux-amd64
        - serve
        - /etc/zot/conf/config.yaml
      ports:
        - containerPort: 443
          hostPort: 443
          protocol: TCP
      volumeMounts:
        - name: zot-config
          mountPath: /etc/zot/conf
        - name: zot-pki
          mountPath: /etc/zot/pki
        - name: zot-data
          mountPath: /var/lib/zot
  volumes:
    - name: zot-config
      configMap:
        name: zot-config
    - name: zot-pki
      hostPath:
        path: /etc/zot/pki
        type: DirectoryOrCreate
    - name: zot-data
      hostPath:
        path: /var/lib/zot
        type: DirectoryOrCreate
