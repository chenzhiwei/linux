---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
data:
  # password can be generated by: openssl passwd -6 your-passwd
  auth.htpasswd: |-
    admin:$6$eTj2qnnocMG7i0b0$RYGcruajKNN7Ay7Co2Cf5KU75d.YNiBN8Wir1swe4Gy853oqps.ONREQb99RYGHEAkbja2jUwfjB7y1vtKm.j.
  config.yaml: |-
    http:
      address: "0.0.0.0"
      port: "5000"
      compat: ["docker2s2"]
      auth:
        htpasswd:
          path: "/etc/zot/auth.htpasswd"
      accessControl:
        repositories:
          "**":
            anonymousPolicy: ["read"]
        adminPolicy:
          users: ["admin"]
          actions: ["read", "create", "update", "delete"]
    storage:
      rootDirectory: "/var/lib/zot"
    extensions:
      ui:
        enable: true
      search:
        enable: true
      sync:
        enable: true
        registries:
          - onDemand: true  # podman pull xxx.com/docker/library/alpine:latest
            urls:
              - "https://docker.io"
            content:
              - prefix: "**"
                destination: "/docker"
          - onDemand: true  # podman pull xxx.com/quay/library/alpine:latest
            urls:
              - "https://quay.io"
            content:
              - prefix: "**"
                destination: "/quay"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  zot-https.conf: |-
    server {
        listen       443 ssl http2;
        server_name  _;

        ssl_certificate      /etc/nginx/pki/zot.crt;
        ssl_certificate_key  /etc/nginx/pki/zot.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers   on;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 52w;
        }
    }

---
apiVersion: v1
kind: Pod
metadata:
  name: zot
spec:
  containers:
    - name: nginx
      image: docker.io/library/nginx:latest
      ports:
        - containerPort: 80
          hostPort: 80
          protocol: TCP
        - containerPort: 443
          hostPort: 443
          protocol: TCP
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: nginx-pki
          mountPath: /etc/nginx/pki
    - name: zot
      image: ghcr.io/project-zot/zot-linux-amd64:latest
      command:
        - zot-linux-amd64
        - serve
        - /etc/zot/config.yaml
      volumeMounts:
        - name: zot-config
          mountPath: /etc/zot
        - name: zot-data
          mountPath: /var/lib/zot
  volumes:
    - name: nginx-config
      configMap:
        name: nginx-config
    - name: nginx-pki
      hostPath:
        path: /etc/nginx/pki
        type: DirectoryOrCreate
    - name: zot-config
      configMap:
        name: zot-config
    - name: zot-data
      hostPath:
        path: /var/lib/zot
        type: DirectoryOrCreate
